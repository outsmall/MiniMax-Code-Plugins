name: XC PR81 isolated Linux verification

on:
  push:
    branches: [verify-xc-pr81-linux-20261120]
    paths: [.github/workflows/xc-pr81-linux-check.yml]

permissions:
  contents: read

jobs:
  check-submitted-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b18
        with:
          ref: 064c3373c034b92533cf903874d8c47bfa462ff5
          persist-credentials: false
      - name: Verify submitted source revision
        run: test "$(git rev-parse HEAD)" = "064c3373c034b92533cf903874d8c47bfa462ff5"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==12.3.0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: npm ci
      - run: npm run check
